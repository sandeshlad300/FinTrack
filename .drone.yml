# ------------------------
# Shared Gradle Cache Volume
# ------------------------
volumes:
  - name: gradle-cache
    temp: {}

# =====================================
# FEATURE BRANCH CI (FAST)
# =====================================
kind: pipeline
type: docker
name: feature-ci

trigger:
  branch:
    - feature/*
  event:
    - push
    - pull_request

steps:
  - name: unit-tests
    image: ghcr.io/cirruslabs/android-sdk:34
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      GRADLE_USER_HOME: /drone/src/.gradle
    commands:
      - chmod +x ./gradlew
      - ./gradlew testDebugUnitTest --no-daemon


---

# =====================================
# DEV BRANCH CI (INTEGRATION)
# =====================================

kind: pipeline
type: docker
name: dev-ci

trigger:
  branch:
    - dev
  event:
    - push
    - pull_request

steps:
   # ------------------------
   # Tests + Lint + Sonar
   # ------------------------
  - name: sonar-analysis
    image: ghcr.io/cirruslabs/android-sdk:34
    environment:
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
      GRADLE_USER_HOME: /drone/src/.gradle
    volumes:
      - name: gradle-cache
        path: /drone/src/.gradle
    commands:
      - chmod +x ./gradlew
        - ./gradlew testDebugUnitTest jacocoTestReport lintDebug sonar \
        -Dsonar.host.url=http://host.docker.internal:9000 \
        -Dsonar.token=$SONAR_TOKEN \
        --no-daemon


    # ------------------------
    # Build APK (Internal QA)
  # ------------------------
  - name: build-debug-apk
    image: ghcr.io/cirruslabs/android-sdk:34
    commands:
      - ./gradlew assembleDebug --no-daemon


---

# =========================================================
# MAIN PIPELINE — Build + Distribute
# =========================================================

kind: pipeline
type: docker
name: android-ci

trigger:
  branch:
    - main
  event:
    - push

steps:

  # ------------------------
  # 0. Sonar + Quality Gate
  # ------------------------
  - name: sonar-quality-gate
    image: ghcr.io/cirruslabs/android-sdk:34
    environment:
      SONAR_TOKEN:
        from_secret: SONAR_TOKEN
      GRADLE_USER_HOME: /drone/src/.gradle
    volumes:
      - name: gradle-cache
        path: /drone/src/.gradle
    commands:
      - chmod +x ./gradlew
      - ./gradlew \
        testDebugUnitTest \
        lintDebug \
        sonar \
        -Dsonar.host.url=http://host.docker.internal:9000 \
        -Dsonar.token=$SONAR_TOKEN \
        --no-daemon

  # ------------------------
  # 1. Build Android APK
  # ------------------------
  - name: build-android
    image: ghcr.io/cirruslabs/android-sdk:34
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      GRADLE_USER_HOME: /drone/src/.gradle
    volumes:
      - name: gradle-cache
        path: /drone/src/.gradle
    commands:
      - chmod +x ./gradlew
      - ./gradlew assembleDebug --no-daemon

  # ------------------------
  # 2. Firebase App Distribution
  # ------------------------
  - name: firebase-app-distribution
    image: node:20
    environment:
      FIREBASE_SERVICE_ACCOUNT_B64:
        from_secret: FIREBASE_SERVICE_ACCOUNT_B64
    commands:
      - npm install -g firebase-tools
      - printf '%s' "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > /tmp/firebase-key.json
      - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
      - firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app 1:570538572956:android:1b987f0824488399760159 --groups testers --release-notes 'Drone CI build'

