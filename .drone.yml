kind: pipeline
type: docker
name: android-ci

steps:
  - name: build-apk
    image: ghcr.io/cirruslabs/android-sdk:34
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      ANDROID_SDK_ROOT: /opt/android-sdk-linux
    commands:
      - chmod +x ./gradlew
      - ./gradlew assembleDebug
      - ./gradlew assembleDebug --no-daemon --stacktrace


  - name: firebase-distribute
    image: node:20
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
      FIREBASE_SERVICE_ACCOUNT:
        from_secret: FIREBASE_SERVICE_ACCOUNT
    commands:
      - npm install -g firebase-tools
      - echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
      - firebase appdistribution:distribute \
        app/build/outputs/apk/debug/app-debug.apk \
        --app 1:570538572956:android:1b987f0824488399760159
        --groups testers \
        --release-notes "Drone CI build"
