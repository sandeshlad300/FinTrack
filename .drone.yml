kind: pipeline
type: docker
name: android-ci

steps:

  - name: build-android
    image: ghcr.io/cirruslabs/android-sdk:34
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      ANDROID_SDK_ROOT: /opt/android-sdk-linux
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000"
    commands:
      - chmod +x ./gradlew
      - ./gradlew assembleDebug --no-daemon

  - name: firebase-app-distribution
    image: node:20
    environment:
      FIREBASE_SERVICE_ACCOUNT:
        from_secret: FIREBASE_SERVICE_ACCOUNT
    commands:
      - npm install -g firebase-tools
      - echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-key.json
      - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-key.json
      - firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk --app 1:570538572956:android:1b987f0824488399760159 --groups testers --release-notes "Drone CI build"
