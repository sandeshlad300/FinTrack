kind: pipeline
type: docker
name: android-ci

steps:
  - name: build-android
    image: gradle:8.1.1-jdk17
    commands:
      - chmod +x ./gradlew
      - ./gradlew assembleDebug

  - name: upload-apk
    image: plugins/artifacts
    settings:
      path:
        - app/build/outputs/apk/debug/*.apk
