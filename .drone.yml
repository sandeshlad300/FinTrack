kind: pipeline
type: docker
name: android-ci

steps:
  - name: build-android
    image: mobiledevops/android-sdk-image:34
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
    commands:
      - chmod +x ./gradlew
      - ./gradlew assembleDebug

  - name: upload-apk
    image: plugins/artifacts
    settings:
      path:
        - app/build/outputs/apk/debug/*.apk
