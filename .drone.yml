kind: pipeline
type: docker
name: android-ci

steps:
  - name: build-android
    image: mobiledevops/android-sdk-image:latest
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
    commands:
      - chmod +x ./gradlew
      - ./gradlew assembleDebug

  - name: upload-apk
    image: plugins/archive
    settings:
      action: upload
      format: zip
      name: apk-build
      files:
        - app/build/outputs/apk/debug/*.apk
